name: Lean reduced ribbon landmark

on:
  push:
    paths:
      - 'ribbons/**'
      - '.github/workflows/ribbons.yml'
  pull_request:
    paths:
      - 'ribbons/**'
      - '.github/workflows/ribbons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landmark2:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      LEAN_NUM_THREADS: '2'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned parent dependencies and whole Mathlib import cache
        run: python3 ribbons/scripts/cache_prerequisites.py
      - name: Verify actual landmark 2 and freshly replay all 359 providers
        run: python3 ribbons/scripts/verify.py --output ribbons/evidence/landmark2-ci --fresh-provider-replay --provider-workers 2
      - name: Preserve actual verification records, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-landmark2-verification
          path: ribbons/evidence/landmark2-ci/
          if-no-files-found: warn
          retention-days: 90
